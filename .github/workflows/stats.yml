name: Update Language Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# FIX 1: Explicitly grant the workflow write permissions so the bot can push the SVG
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # FIX 2: Use the default GITHUB_TOKEN for checkout (no PAT needed here)
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      # FIX 3: Keep your PAT here. The Python script uses it to read private repos.
      - name: Run Stats Generator
        env:
          GH_TOKEN: ${{ secrets.STATS_PAT }}
        run: python generate_stats.py

      - name: Commit and Push SVG
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add languages.svg
          git commit -m "Auto-update language stats" || exit 0
          git push origin HEAD:main
