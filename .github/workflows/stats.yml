name: Update Language Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Stats Generator
        env:
          GH_TOKEN: ${{ secrets.STATS_PAT }}
        run: python generate_stats.py

      - name: Commit and Push SVG
        env:
          PAT: ${{ secrets.STATS_PAT }} 
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add languages.svg
          git commit -m "Auto-update language stats" || exit 0
          
          # Force the push using the PAT directly in the URL
          git push https://${PAT}@github.com/${{ github.repository }}.git HEAD:main
