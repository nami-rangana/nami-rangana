<svg width="400" height="160" xmlns="http://www.w3.org/2000/svg">
    <style>
        .bg { fill: #0d1117; }
        .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #ffffff; }
        .lang-name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #ffffff; }
        .lang-pct { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 400; fill: #8b949e; }
    </style>
    
    <rect width="100%" height="100%" class="bg" rx="10"/>
    <text x="20" y="30" class="title">Languages</text>
    
    <defs>
        <clipPath id="bar-clip">
            <rect x="20" y="50" width="360" height="10" rx="5"/>
        </clipPath>
    </defs>
    
    <g clip-path="url(#bar-clip)">
            <rect x="20" y="50" width="164.05082826720744" height="10" fill="#f34b7d"/>
        <rect x="184.05082826720744" y="50" width="114.69224123307073" height="10" fill="#4d41b1"/>
        <rect x="298.7430695002782" y="50" width="32.69253316816645" height="10" fill="#555555"/>
        <rect x="331.43560266844463" y="50" width="28.73910076100378" height="10" fill="#858585"/>
        <rect x="360.1747034294484" y="50" width="15.439926463916423" height="10" fill="#3572A5"/>
    </g>

    

    <g transform="translate(20, 85)">
        <circle cx="0" cy="-4" r="4" fill="#f34b7d"/>
        <text x="10" y="0">
            <tspan class="lang-name">C++ </tspan>
            <tspan class="lang-pct">45.6%</tspan>
        </text>
    </g>
    <g transform="translate(190, 85)">
        <circle cx="0" cy="-4" r="4" fill="#4d41b1"/>
        <text x="10" y="0">
            <tspan class="lang-name">Fortran </tspan>
            <tspan class="lang-pct">31.9%</tspan>
        </text>
    </g>
    <g transform="translate(20, 110)">
        <circle cx="0" cy="-4" r="4" fill="#555555"/>
        <text x="10" y="0">
            <tspan class="lang-name">C </tspan>
            <tspan class="lang-pct">9.1%</tspan>
        </text>
    </g>
    <g transform="translate(190, 110)">
        <circle cx="0" cy="-4" r="4" fill="#858585"/>
        <text x="10" y="0">
            <tspan class="lang-name">Cuda </tspan>
            <tspan class="lang-pct">8.0%</tspan>
        </text>
    </g>
    <g transform="translate(20, 135)">
        <circle cx="0" cy="-4" r="4" fill="#3572A5"/>
        <text x="10" y="0">
            <tspan class="lang-name">Python </tspan>
            <tspan class="lang-pct">4.3%</tspan>
        </text>
    </g>
</svg>